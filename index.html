<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rental Log">
<meta name="theme-color" content="#123B37">
<title>Rental Log</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; overscroll-behavior-y: none; }
  body {
    --ink: #16332F;
    --teal-deep: #123B37;
    --teal-mid: #1F6259;
    --lagoon: #3FAE9F;
    --lagoon-soft: #DCEFE9;
    --sand: #F7F2E7;
    --sand-dark: #EDE3CC;
    --coral: #E0663F;
    --coral-soft: #FBE4D9;
    --white: #FFFFFF;
    --line: #DDD3B8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--sand);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top);
    min-height: 100vh;
    min-height: 100dvh;
  }
  .bl-display { font-family: 'Arial Black', 'Helvetica Neue', sans-serif; font-weight: 900; letter-spacing: 0.01em; text-transform: uppercase; }
  .bl-mono { font-family: 'SF Mono', 'Courier New', monospace; }

  .bl-wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px calc(90px + env(safe-area-inset-bottom)); }

  .bl-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .bl-header h1 { font-size: 30px; margin: 0; color: var(--teal-deep); line-height: 0.95; }
  .bl-header .bl-tag { font-size: 12.5px; color: var(--teal-mid); margin-top: 4px; font-weight: 600; }

  .bl-fab {
    position: fixed; bottom: calc(22px + env(safe-area-inset-bottom)); right: 22px; width: 58px; height: 58px; border-radius: 50%;
    background: var(--coral); color: white; border: none; font-size: 28px; font-weight: 400;
    box-shadow: 0 4px 14px rgba(224,102,63,0.5); cursor: pointer; z-index: 40;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .bl-fab:active { transform: scale(0.94); }

  .bl-section-label { font-size: 11.5px; font-weight: 700; color: var(--teal-mid); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 8px; }

  .bl-dock { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; -webkit-overflow-scrolling: touch; }
  .bl-dragging { opacity: 0.95; transform: scale(1.06); box-shadow: 0 10px 24px rgba(0,0,0,0.35); pointer-events: none; }
  .bl-drag-placeholder { border: 2px dashed var(--line); border-radius: 10px; background: var(--sand-dark); opacity: 0.6; flex: 0 0 auto; }
  .bl-piling {
    background: var(--teal-deep); border-radius: 10px; padding: 12px 14px 10px;
    min-width: 108px; flex: 0 0 auto; position: relative; overflow: hidden;
    color: var(--sand); cursor: pointer;
  }
  .bl-piling .bl-item-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.85; margin-bottom: 6px; position: relative; z-index: 2;}
  .bl-piling .bl-waterline { position: absolute; left: 0; right: 0; bottom: 0; background: var(--lagoon); transition: height 0.4s ease; z-index: 1; }
  .bl-piling .bl-waterline::before { content: ''; position: absolute; top: -3px; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 8px, transparent 8px 16px); }
  .bl-piling .bl-count { font-size: 24px; font-weight: 700; position: relative; z-index: 2; font-family: 'SF Mono', 'Courier New', monospace; }
  .bl-piling .bl-count small { font-size: 12px; font-weight: 500; opacity: 0.8; }
  .bl-piling .bl-sub { font-size: 10.5px; position: relative; z-index: 2; opacity: 0.9; margin-top: 2px; }
  .bl-piling .bl-price-tag { font-size: 10.5px; position: relative; z-index: 2; opacity: 0.95; margin-top: 4px; font-weight: 700; }
  .bl-piling.bl-add-item { display: flex; align-items: center; justify-content: center; background: transparent; border: 2px dashed var(--line); color: var(--teal-mid); font-weight: 700; font-size: 12.5px; min-height: 88px; text-align: center; }

  .bl-addon-piling { background: var(--teal-mid); }
  .bl-addon-applies { font-size: 9.5px; position: relative; z-index: 2; opacity: 0.85; margin-top: 4px; line-height: 1.25; }
  .bl-addon-used { font-size: 9.5px; color: var(--teal-mid); font-weight: 700; margin-top: 2px; }
  .bl-addon-size-breakdown { font-size: 9px; position: relative; z-index: 2; opacity: 0.9; margin-top: 3px; line-height: 1.3; }

  .bl-addon-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 22px; -webkit-overflow-scrolling: touch; }
  .bl-addon-chip {
    background: var(--white); border: 1.5px solid var(--line); border-radius: 20px; padding: 8px 14px;
    font-size: 12.5px; font-weight: 600; color: var(--ink); flex: 0 0 auto; cursor: pointer; white-space: nowrap;
  }
  .bl-addon-chip b { color: var(--teal-mid); margin-left: 4px; }
  .bl-addon-chip.bl-add-addon { border-style: dashed; color: var(--teal-mid); }

  .bl-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .bl-tab { flex: 0 0 auto; background: none; border: none; padding: 8px 13px; border-radius: 20px; font-size: 12.5px; font-weight: 700; color: var(--teal-mid); cursor: pointer; white-space: nowrap; }
  .bl-tab.active { background: var(--teal-deep); color: white; }
  .bl-tab .bl-tab-count { opacity: 0.7; margin-left: 2px; }

  .bl-cards { display: flex; flex-direction: column; gap: 10px; }
  .bl-card { background: var(--white); border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); }
  .bl-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .bl-card-title { font-weight: 700; font-size: 15.5px; }
  .bl-card-title-clickable { cursor: pointer; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .bl-card-meta { font-size: 12px; color: #5B6E68; margin-top: 2px; }
  .bl-card-addons { font-size: 11.5px; color: var(--teal-mid); margin-top: 2px; font-weight: 600; }
  .bl-card-dates { font-size: 12px; color: var(--teal-mid); font-weight: 700; text-align: right; }
  .bl-card-money { font-size: 12px; color: #5B6E68; margin-top: 6px; }
  .bl-card-money b { color: var(--ink); }

  .bl-stepper { display: flex; align-items: center; margin: 12px 0 2px; }
  .bl-step { display: flex; align-items: center; gap: 5px; }
  .bl-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--sand-dark); border: 2px solid var(--line); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; }
  .bl-dot-clickable { cursor: pointer; }
  .bl-dot-clickable:hover { box-shadow: 0 0 0 3px var(--coral-soft); }
  .bl-dot.done { background: var(--lagoon); border-color: var(--teal-mid); color: white; }
  .bl-step-label { font-size: 9.5px; font-weight: 700; color: #8A9490; text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; display: none; }
  .bl-step-label.done { color: var(--teal-mid); }
  .bl-step-line { height: 2px; flex: 1; background: var(--line); margin: 0 3px; min-width: 8px; }
  .bl-step-line.done { background: var(--lagoon); }

  @media (min-width: 480px) {
    .bl-step-label { display: block; }
  }

  .bl-card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .bl-action-btn { border: none; border-radius: 7px; padding: 10px 14px; font-size: 13px; font-weight: 700; cursor: pointer; color: white; background: var(--coral); text-align: right; }
  .bl-action-btn:active { opacity: 0.85; }
  .bl-edit-btn { background: none; border: none; color: #8A9490; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 6px 0; }
  .bl-done-tag { font-size: 12px; font-weight: 700; color: var(--teal-mid); background: var(--lagoon-soft); padding: 6px 10px; border-radius: 6px; }
  .bl-cancelled-tag { color: #A8492A; background: var(--coral-soft); }
  .bl-cancelled-banner { font-size: 12.5px; font-weight: 700; color: #A8492A; background: var(--coral-soft); padding: 8px 12px; border-radius: 8px; margin: 12px 0 2px; }
  .bl-cancel-reason-options { display: flex; flex-wrap: wrap; gap: 8px; }
  .bl-cancel-reason-btn { padding: 9px 14px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--sand); color: var(--ink); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .bl-cancel-reason-btn.selected { background: var(--teal-deep); border-color: var(--teal-deep); color: white; }
  .bl-cancel-btn-link { color: var(--coral) !important; }

  .bl-empty { text-align: center; padding: 46px 20px; color: #8A9490; }
  .bl-empty .bl-display { font-size: 20px; color: var(--teal-mid); margin-bottom: 6px; }

  .bl-overlay { position: fixed; inset: 0; background: rgba(18, 51, 47, 0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .bl-modal { background: white; border-radius: 16px 16px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .bl-detail-header { border-bottom: 1.5px solid var(--line); padding-bottom: 14px; margin-bottom: 14px; }
  .bl-detail-status { margin-bottom: 4px; }
  @media (min-width: 560px) {
    .bl-overlay { align-items: center; padding: 20px; }
    .bl-modal { border-radius: 14px; }
  }
  .bl-modal h2 { font-family: 'Arial Black', sans-serif; text-transform: uppercase; font-size: 20px; color: var(--teal-deep); margin: 0 0 14px; }
  .bl-field { margin-bottom: 14px; }
  .bl-field label { display: block; font-size: 11.5px; font-weight: 700; color: var(--teal-mid); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.02em; }
  .bl-field input, .bl-field select { width: 100%; height: 44px; box-sizing: border-box; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 7px; font-size: 16px; font-family: inherit; background: var(--sand); }
  .bl-field input[type="date"] { -webkit-appearance: none; appearance: none; }
  .bl-field input:focus, .bl-field select:focus { outline: 2px solid var(--lagoon); border-color: var(--lagoon); }
  .bl-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bl-time-trigger { width: 100%; height: 44px; box-sizing: border-box; text-align: left; padding: 0 10px; border: 1.5px solid var(--line); border-radius: 7px; font-size: 15px; font-family: inherit; background: var(--sand); color: var(--ink); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .bl-time-trigger-caret { color: var(--teal-mid); font-size: 11px; }
  .bl-wheel-time-panel { margin-top: 8px; }
  .bl-daterange-panel { margin-top: 8px; }
  .bl-daterange-actions { display: flex; gap: 8px; margin-top: 8px; }
  .bl-daterange-actions .bl-cancel-btn, .bl-daterange-actions .bl-save-btn { flex: 1; margin: 0; }
  .bl-mini-cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .bl-mini-cal-nav-btn { background: var(--sand-dark); border: none; width: 30px; height: 30px; border-radius: 7px; font-size: 16px; color: var(--teal-deep); cursor: pointer; }
  .bl-mini-cal-month-label { font-size: 13.5px; font-weight: 700; color: var(--teal-deep); }
  .bl-mini-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .bl-mini-cal-wd { text-align: center; font-size: 10.5px; font-weight: 700; color: #8A9490; padding: 4px 0; }
  .bl-mini-cal-day { background: none; border: none; height: 34px; border-radius: 7px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .bl-mini-cal-day:hover { background: var(--sand-dark); }
  .bl-mini-cal-empty { cursor: default; }
  .bl-mini-cal-inrange { background: var(--lagoon-soft); border-radius: 0; }
  .bl-mini-cal-start, .bl-mini-cal-end { background: var(--teal-mid); color: white; font-weight: 700; }
  .bl-time-done-btn { display: block; width: 100%; margin-top: 8px; background: var(--teal-mid); color: white; border: none; padding: 9px; border-radius: 7px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .bl-wheel-time { position: relative; display: flex; gap: 2px; height: 180px; background: var(--sand); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bl-wheel-highlight { position: absolute; top: 50%; left: 6px; right: 6px; height: 36px; transform: translateY(-18px); background: var(--sand-dark); border-radius: 8px; pointer-events: none; z-index: 0; box-shadow: 0 0 0 1px var(--line) inset; }
  .bl-wheel-col { flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; padding: 72px 0; scrollbar-width: none; height: 100%; }
  .bl-wheel-col::-webkit-scrollbar { display: none; }
  .bl-wheel-item { height: 36px; display: flex; align-items: center; justify-content: center; font-size: 17px; scroll-snap-align: center; color: var(--ink); opacity: 0.32; font-weight: 500; transition: opacity 0.15s, font-weight 0.15s; }
  .bl-wheel-item.bl-wheel-selected { opacity: 1; font-weight: 700; color: var(--teal-deep); }
  .bl-modal-actions { display: flex; justify-content: space-between; margin-top: 16px; gap: 8px; align-items: center; }
  .bl-cancel-btn { background: none; border: none; color: #8A9490; font-weight: 700; cursor: pointer; font-size: 13px; padding: 8px 0;}
  .bl-save-btn { background: var(--coral); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .bl-delete-btn { background: none; border: none; color: var(--coral); font-weight: 700; cursor: pointer; font-size: 12px; padding: 8px 0;}

  .bl-banner { background: #FBE4D9; color: #A8492A; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .bl-retry-btn { background: #A8492A; color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: 6px; }

  .bl-save-toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
    background: var(--teal-deep); color: white; padding: 8px 16px; border-radius: 20px;
    font-size: 12.5px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
    z-index: 60; box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  }
  .bl-save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bl-view-toggle { display: flex; gap: 6px; margin-bottom: 18px; background: var(--sand-dark); border-radius: 10px; padding: 4px; }
  .bl-view-btn { flex: 1; border: none; background: none; padding: 9px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--teal-mid); cursor: pointer; }
  .bl-view-btn.active { background: var(--teal-deep); color: white; }

  .bl-cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .bl-cal-nav-btn { background: var(--white); border: 1.5px solid var(--line); width: 34px; height: 34px; border-radius: 8px; font-size: 16px; font-weight: 700; color: var(--teal-mid); cursor: pointer; }
  .bl-cal-label { font-size: 14px; font-weight: 700; color: var(--teal-deep); }
  .bl-cal-label-btn { background: none; border: none; font-family: inherit; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .bl-cal-label-btn:hover { background: var(--sand-dark); }
  .bl-cal-today-btn { background: none; border: none; color: var(--teal-mid); font-size: 12px; font-weight: 700; cursor: pointer; text-decoration: underline; }

  .bl-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 16px; }
  .bl-cal-grid-month { gap: 4px; }
  .bl-cal-month-weekday { text-align: center; font-size: 9.5px; font-weight: 700; color: #8A9490; text-transform: uppercase; padding-bottom: 2px; }
  .bl-cal-day-month { min-height: 72px; padding: 4px 3px 4px; text-align: left; display: flex; flex-direction: column; }
  .bl-cal-day-month .bl-cal-daynum { font-size: 11.5px; margin: 0 0 2px; text-align: center; }
  .bl-cal-chips { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: hidden; }
  .bl-cal-chip { font-size: 9px; font-weight: 700; color: white; padding: 2px 4px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  .bl-cal-chip-done { opacity: 0.5; }
  .bl-cal-chip-more { font-size: 8.5px; color: #8A9490; font-weight: 700; text-align: center; margin-top: 1px; }
  .bl-cal-day-muted { opacity: 0.35; }
  .bl-cal-month-weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 2px; }
  .bl-cal-month-weeks { display: flex; flex-direction: column; background: var(--white); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bl-cal-week-row { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 20px repeat(3, 17px) 12px; column-gap: 0; row-gap: 2px; border-bottom: 1px solid var(--line); padding: 3px 0; }
  .bl-cal-week-row:last-child { border-bottom: none; }
  .bl-cal-day-bg { cursor: pointer; background: transparent; position: relative; z-index: 0; }
  .bl-cal-day-bg.selected { background: var(--lagoon-soft); }
  .bl-cal-day-bg.today { box-shadow: inset 0 0 0 1.5px var(--coral); }
  .bl-cal-daynum-cell { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--ink); font-family: 'SF Mono', 'Courier New', monospace; cursor: pointer; border-radius: 6px; position: relative; z-index: 1; }
  .bl-cal-col-divider { border-right: 1px solid var(--line); pointer-events: none; position: relative; z-index: 1; }
  .bl-cal-daynum-cell.today { color: var(--coral); }
  .bl-cal-bar { font-size: 9.5px; font-weight: 700; color: white; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; z-index: 2; }
  .bl-cal-bar-done { opacity: 0.5; }
  .bl-cal-bar-contleft { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -2px; }
  .bl-cal-bar-contright { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: -2px; }
  .bl-cal-more-cell { font-size: 9px; font-weight: 700; color: var(--teal-mid); text-align: center; cursor: pointer; position: relative; z-index: 2; background: var(--sand-dark); border-radius: 4px; display: flex; align-items: center; justify-content: center; margin: 0 1px; }
  .bl-cal-more-cell:hover { background: var(--lagoon-soft); }

  .bl-week-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .bl-week-day-card { background: var(--white); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
  .bl-week-day-card.today { border-color: var(--coral); }
  .bl-week-day-card.selected { background: var(--lagoon-soft); }
  .bl-week-day-head { display: flex; justify-content: space-between; align-items: center; }
  .bl-week-day-date { font-size: 13.5px; font-weight: 700; color: var(--teal-deep); }
  .bl-week-day-bookings { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .bl-week-booking { font-size: 12.5px; color: var(--ink); padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .bl-booking-status { font-size: 11px; font-weight: 700; }
  .bl-booking-status-done { color: var(--teal-mid); }
  .bl-booking-status-cancelled { color: var(--coral); }
  .bl-week-booking:hover { background: var(--sand); }
  .bl-week-booking-addons { font-size: 11px; color: var(--teal-mid); font-weight: 600; margin-top: 1px; padding-left: 14px; }
  .bl-week-day-empty { margin-top: 6px; font-size: 11.5px; color: #8A9490; }
  .bl-cal-day { background: var(--white); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 4px 7px; text-align: center; cursor: pointer; }
  .bl-cal-day.selected { border-color: var(--teal-mid); background: var(--lagoon-soft); }
  .bl-cal-day.today .bl-cal-daynum { color: var(--coral); }
  .bl-cal-weekday { font-size: 9.5px; font-weight: 700; color: #8A9490; text-transform: uppercase; }
  .bl-cal-daynum { font-size: 16px; font-weight: 700; color: var(--ink); margin: 2px 0 5px; font-family: 'SF Mono', 'Courier New', monospace; }
  .bl-cal-badge { font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 3px 0; }
  .bl-cal-badge.ok { background: var(--lagoon-soft); color: var(--teal-mid); }
  .bl-cal-badge.low { background: #FDF0DA; color: #9A6B1E; }
  .bl-cal-badge.none { background: var(--coral-soft); color: #A8492A; }

  .bl-day-detail { background: var(--white); border-radius: 12px; border: 1px solid var(--line); padding: 16px; }
  .bl-day-detail h3 { margin: 0 0 12px; font-size: 15px; color: var(--teal-deep); }
  .bl-day-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }

          (r.notes ? ' · ' + esc(r.notes) : '') + '</div>';

        html += renderRentalStatusBlock(r, true);
        html += '</div>';
      });
      html += '</div>';
    }

    root.innerHTML = html;
    bindEvents();
  }

  function renderRentalStatusBlock(r, includeEditButton) {
    var html = '';
    if (r.cancelled) {
      var keptAmt = r.depositPaid ? (Number(r.depositAmount) || 0) : 0;
      html += '<div class="bl-cancelled-banner">Cancelled' + (r.cancelReason ? ' — ' + esc(r.cancelReason) : '') + (keptAmt > 0 ? ' — kept ' + fmtMoney(keptAmt) + ' non-refundable reservation deposit' : '') + '</div>';
    } else {
      html += '<div class="bl-stepper">';
      STEPS.forEach(function (s, i) {
        var literalDone = !!r[s.key];
        var done = literalDone || (s.key === 'depositPaid' && r.yoodlize);
        var clickable = literalDone && s.key !== 'depositPaid';
        html += '<div class="bl-step"><div class="bl-dot' + (done ? ' done' : '') + (clickable ? ' bl-dot-clickable' : '') + '"' +
          (clickable ? ' data-action="undo-step" data-id="' + r.id + '" data-step="' + s.key + '" title="Tap to undo"' : '') + '>' + (done ? '✓' : '') + '</div>' +
          '<div class="bl-step-label' + (done ? ' done' : '') + '">' + s.label + '</div></div>';
        if (i < STEPS.length - 1) html += '<div class="bl-step-line' + (done ? ' done' : '') + '"></div>';
      });
      html += '</div>';
    }
    html += '<div class="bl-card-actions">';
    if (includeEditButton) html += '<button class="bl-edit-btn" data-action="edit-rental" data-id="' + r.id + '">Edit details</button>';
    if (r.cancelled) {
      html += '<span class="bl-done-tag bl-cancelled-tag">Cancelled</span>';
    } else {
      var lastStepIdx = -1;
      for (var si = STEPS.length - 1; si >= 1; si--) { if (r[STEPS[si].key]) { lastStepIdx = si; break; } }
      if (lastStepIdx !== -1) html += '<button class="bl-edit-btn bl-cancel-btn-link" data-action="undo-step" data-id="' + r.id + '" data-step="' + STEPS[lastStepIdx].key + '">Undo "' + esc(STEPS[lastStepIdx].label) + '"</button>';
      if (!r.itemReturned) html += '<button class="bl-edit-btn bl-cancel-btn-link" data-action="cancel-rental" data-id="' + r.id + '">Cancel rental</button>';
      var na = nextAction(r);
      if (na) html += '<button class="bl-action-btn" data-action="advance" data-id="' + r.id + '" data-step="' + na.key + '">' + esc(na.label) + '</button>';
      else html += '<span class="bl-done-tag">All settled ✓</span>';
    }
    html += '</div>';
    return html;
  }

  function renderCalendar() {
    var html = '';
    html += '<div class="bl-view-toggle" style="margin-bottom:12px;">' +
      '<button class="bl-view-btn' + (state.calendarMode === 'week' ? ' active' : '') + '" data-cal-mode="week">Week</button>' +
      '<button class="bl-view-btn' + (state.calendarMode === 'month' ? ' active' : '') + '" data-cal-mode="month">Month</button>' +

  function dayCellDots(dateStr) {

  function dayCellChips(dateStr, maxShow) {

  function renderWeekGrid() {
    var todayStr = toISODate(new Date());

    var html = '';

    html += '<div class="bl-cal-nav">' +
      '<button class="bl-cal-nav-btn" data-action="week-prev">‹</button>' +

          var pickupLine = r.pickupTime ? fmtDate(r.startDate) + ' at ' + fmtTime(r.pickupTime) : fmtDate(r.startDate);

  function computeWeekBars(weekDates) {
    var weekStart = weekDates[0], weekEnd = weekDates[6];
    var items = [];
    state.rentals.forEach(function (r) {
      if (!r.startDate || !r.endDate) return;
      if (r.endDate < weekStart || r.startDate > weekEnd) return;
      var barStartDate = r.startDate < weekStart ? weekStart : r.startDate;
      var barEndDate = r.endDate > weekEnd ? weekEnd : r.endDate;
      items.push({
        r: r,
        startCol: weekDates.indexOf(barStartDate),
        endCol: weekDates.indexOf(barEndDate),
        continuesLeft: r.startDate < weekStart,
        continuesRight: r.endDate > weekEnd,
      });
    });
    items.sort(function (a, b) {
      return a.startCol - b.startCol ||
        (a.r.pickupTime || '00:00').localeCompare(b.r.pickupTime || '00:00') ||
        (b.endCol - b.startCol) - (a.endCol - a.startCol);
    });
    var laneEnds = [];
    items.forEach(function (item) {
      var lane = -1;
      for (var i = 0; i < laneEnds.length; i++) { if (laneEnds[i] < item.startCol) { lane = i; break; } }
      if (lane === -1) { lane = laneEnds.length; laneEnds.push(-1); }
      laneEnds[lane] = item.endCol;
      item.lane = lane;
    });
    return items;
  }

  function renderMonthGrid() {
    var weekdays = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    var todayStr = toISODate(new Date());
    var monthStart = startOfMonth(state.monthCursor);
    var monthDate = parseISO(monthStart);
    var monthLabel = monthDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    var gridStart = startOfWeek(monthStart);
    var html = '';

    html += '<div class="bl-cal-nav">' +
      '<button class="bl-cal-nav-btn" data-action="month-prev">‹</button>' +
      '<div><button type="button" class="bl-cal-label bl-cal-label-btn" data-action="open-month-picker">' + monthLabel + '</button></div>' +
      '<button class="bl-cal-nav-btn" data-action="month-next">›</button>' +
      '</div>';
    html += '<div style="text-align:center;margin-bottom:10px;"><button class="bl-cal-today-btn" data-action="month-today">Jump to today</button></div>';

    html += '<div class="bl-cal-month-weekday-row">';
    weekdays.forEach(function (w) { html += '<div class="bl-cal-month-weekday">' + w + '</div>'; });
    html += '</div>';

    var curMonthIdx = monthDate.getMonth();
    var MAX_LANES = 3;
    html += '<div class="bl-cal-month-weeks">';
    for (var week = 0; week < 6; week++) {
      var weekDates = [];
      for (var d = 0; d < 7; d++) weekDates.push(addDays(gridStart, week * 7 + d));
      var bars = computeWeekBars(weekDates);

      html += '<div class="bl-cal-week-row">';
      weekDates.forEach(function (dateStr, idx) {
        html += '<div class="bl-cal-day-bg' + (dateStr === state.selectedDay ? ' selected' : '') + (dateStr === todayStr ? ' today' : '') + '" data-day="' + dateStr + '" style="grid-column:' + (idx + 1) + ';grid-row:1 / -1;"></div>';
      });
      for (var col = 1; col <= 6; col++) {
        html += '<div class="bl-cal-col-divider" style="grid-column:' + col + ';grid-row:1 / -1;"></div>';
      }
      weekDates.forEach(function (dateStr, idx) {
        var dt = parseISO(dateStr);
        var inMonth = dt.getMonth() === curMonthIdx;
        html += '<div class="bl-cal-daynum-cell' + (inMonth ? '' : ' bl-cal-day-muted') + (dateStr === todayStr ? ' today' : '') + '" data-day="' + dateStr + '" style="grid-column:' + (idx + 1) + ';grid-row:1;">' + dt.getDate() + '</div>';
      });
      bars.forEach(function (item) {
        if (item.lane >= MAX_LANES) return;
        var item_r = item.r;
        var itemInv = state.inventory.find(function (i) { return i.id === item_r.itemId; });
        var color = itemInv ? itemInv.color : 'var(--lagoon)';
        var done = item_r.cancelled || item_r.itemReturned;
        var itemLabel = rentalItemLabel(item_r, itemInv, item_r.itemName);
        var label = esc(item_r.customerName || 'Unnamed') + ' - ' + itemLabel;
        html += '<div class="bl-cal-bar' + (done ? ' bl-cal-bar-done' : '') + (item.continuesLeft ? ' bl-cal-bar-contleft' : '') + (item.continuesRight ? ' bl-cal-bar-contright' : '') + '" data-rental-id="' + item_r.id + '" style="grid-column:' + (item.startCol + 1) + ' / ' + (item.endCol + 2) + ';grid-row:' + (item.lane + 2) + ';background:' + color + ';" title="' + label + '">' + label + '</div>';
      });
      for (var c = 0; c < 7; c++) {
        var hiddenCount = bars.filter(function (b) { return b.lane >= MAX_LANES && c >= b.startCol && c <= b.endCol; }).length;
        if (hiddenCount > 0) {
          html += '<div class="bl-cal-more-cell" data-action="show-day-overflow" data-day="' + weekDates[c] + '" style="grid-column:' + (c + 1) + ';grid-row:' + (MAX_LANES + 2) + ';">+' + hiddenCount + '</div>';
        }
      }
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function renderDayDetail() {

    var html = '';

    var rentedLabel = state.selectedDay === toISODate(new Date()) ? 'Rented today' : 'Rented ' + fmtDate(state.selectedDay);

    }
    detail.rows.forEach(function (row) {
      var cls = row.avail === 0 ? 'none' : (row.avail === row.total ? 'ok' : (row.total > 0 && row.avail <= Math.max(1, Math.ceil(row.total * 0.2)) ? 'low' : 'ok'));
      var label = row.hasComponents ? row.name + ' (full setup)' : row.name;

    if (unlinkedAddons.length > 0) {

        html += '<div class="bl-day-item-row"><span>' + esc(a.name) + '</span>' +
          '<span class="bl-day-item-avail ' + aCls + '">' + a.avail + ' / ' + a.total + ' available</span></div>';
        if (a.sizes) {
          html += '<div class="bl-day-addon-sizes">' + a.sizes.map(function (s) { return esc(s.size) + ' ' + s.avail + '/' + s.total; }).join(' · ') + '</div>';
        }

    if (detail.booked.length > 0) {
      html += '<div class="bl-day-booked-label">' + rentedLabel + '</div>';
      detail.booked.forEach(function (r) {

        var statusTag = r.cancelled ? ' <span class="bl-booking-status bl-booking-status-cancelled">(cancelled)</span>' : (r.itemReturned ? ' <span class="bl-booking-status bl-booking-status-done">(completed)</span>' : '');
        var pickupLine = r.pickupTime ? fmtDate(r.startDate) + ' at ' + fmtTime(r.pickupTime) : fmtDate(r.startDate);
        var dropoffLine = r.dropoffTime ? fmtDate(r.endDate) + ' at ' + fmtTime(r.dropoffTime) : fmtDate(r.endDate);
        html += '<div class="bl-day-booked-card bl-day-booked-clickable" data-rental-id="' + r.id + '">' +
          '<div class="bl-day-booked-title">' + (item ? '<span class="bl-day-item-dot" style="background:' + item.color + '"></span>' : '') +
          rentalItemLabel(r, item, r.itemName) + ' — ' + esc(r.customerName || 'Unnamed customer') + (r.source ? ' (' + esc(r.source) + ')' : '') + statusTag + '</div>' +
          (addonsText ? '<div class="bl-day-booked-addons">+ ' + esc(addonsText) + '</div>' : '') +
          '<div class="bl-day-booked-meta"><span>Pick up: ' + pickupLine + '</span><span>Drop off: ' + dropoffLine + '</span>' +
          (r.notes ? '<span>Notes: ' + esc(r.notes) + '</span>' : '') + '</div>' +
          '</div>';
      });
    } else if (detail.rows.length > 0) {
      html += '<div class="bl-day-booked-label">' + rentedLabel + '</div>';
      html += '<div class="bl-day-booked-row">Nothing rented on this day.</div>';
    }
    html += '</div>';

  }

  function computeMonthlyStats(itemFilterId) {
    var earliestYear = null, latestYear = null;
    function trackYear(y) {
      y = Number(y);
      if (!y) return;
      if (earliestYear === null || y < earliestYear) earliestYear = y;
      if (latestYear === null || y > latestYear) latestYear = y;
    }
    state.rentals.forEach(function (r) { if (r.startDate) trackYear(r.startDate.slice(0, 4)); });
    state.expenses.forEach(function (e) { if (e.year) trackYear(e.year); });
    state.historicalAdjustments.forEach(function (h) { if (h.year) trackYear(h.year); });
    var now = new Date();
    trackYear(now.getFullYear());
    if (earliestYear === null) { earliestYear = now.getFullYear(); latestYear = now.getFullYear(); }
    if (latestYear < now.getFullYear()) latestYear = now.getFullYear();

    var months = [];
    for (var y = earliestYear; y <= latestYear; y++) {
      var maxMonth = (y === now.getFullYear()) ? now.getMonth() : 11;
      for (var m = 0; m <= maxMonth; m++) {
        months.push({ year: y, month: m, revenue: 0, expenses: 0, profit: 0, rentals: 0, label: new Date(y, m, 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) });
      }
    }
    var monthIndex = {};
    months.forEach(function (mo, i) { monthIndex[mo.year + '-' + mo.month] = i; });

    state.rentals.forEach(function (r) {
      if (!r.pickedUp || r.cancelled || !r.startDate) return;
      if (itemFilterId && r.itemId !== itemFilterId) return;
      var d = parseISO(r.startDate);
      var key = d.getFullYear() + '-' + d.getMonth();
      var idx = monthIndex[key];
      if (idx === undefined) return;
      months[idx].revenue += Number(r.price) || 0;
      months[idx].rentals += 1;
    });
    state.expenses.forEach(function (e) {
      if (!e.year) return;
      if (itemFilterId && e.itemId !== itemFilterId) return;
      for (var m = 0; m < 12; m++) {
        var idx = monthIndex[Number(e.year) + '-' + m];
        if (idx !== undefined) months[idx].expenses += (Number(e.amount) || 0) / 12;
      }
    });
    state.historicalAdjustments.forEach(function (h) {
      if (!h.year) return;
      if (itemFilterId && h.itemId !== itemFilterId) return;
      for (var m = 0; m < 12; m++) {
        var idx = monthIndex[Number(h.year) + '-' + m];
        if (idx !== undefined) {
          months[idx].revenue += (Number(h.revenue) || 0) / 12;
          months[idx].rentals += (Number(h.rentalCount) || 0) / 12;
        }
      }
    });
    months.forEach(function (mo) { mo.profit = mo.revenue - mo.expenses; });
    return months;
  }

  function renderFinanceChart(months, activeMetrics, itemFilterId, chartType) {
    var W = Math.max(months.length * 46, 320);
    var H = 180;
    var padL = 34, padR = 10, padT = 10, padB = 22;
    var chartW = W - padL - padR, chartH = H - padT - padB;
    var metricDefs = {
      revenue: { color: '#27B9A1', label: 'Revenue' },
      profit: { color: '#2764B9', label: 'Profit' },
      expenses: { color: '#A02237', label: 'Expenses (avg/mo)' },
      rentals: { color: '#A06B22', label: '# Rentals' }
    };
    var dollarMetrics = ['revenue', 'profit', 'expenses'].filter(function (k) { return activeMetrics.indexOf(k) !== -1; });
    var countActive = activeMetrics.indexOf('rentals') !== -1;
    var maxDollar = 1, minDollar = 0;
    months.forEach(function (mo) {
      dollarMetrics.forEach(function (k) {
        if (mo[k] > maxDollar) maxDollar = mo[k];
        if (mo[k] < minDollar) minDollar = mo[k];
      });
    });
    var maxCount = 1;
    months.forEach(function (mo) { if (mo.rentals > maxCount) maxCount = mo.rentals; });

    function xFor(i) { return padL + (months.length <= 1 ? chartW / 2 : (i / (months.length - 1)) * chartW); }
    function yForDollar(v) { return padT + chartH - ((v - minDollar) / (maxDollar - minDollar || 1)) * chartH; }
    function yForCount(v) { return padT + chartH - (v / maxCount) * chartH; }

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" style="display:block;">';
    var zeroY = yForDollar(0);
    svg += '<line x1="' + padL + '" y1="' + zeroY + '" x2="' + (padL + chartW) + '" y2="' + zeroY + '" stroke="var(--line)" stroke-width="1"></line>';

    if (chartType === 'bar') {
      var slotW = months.length > 1 ? chartW / months.length : chartW;
      var barGroupW = slotW * 0.7;
      var barW = dollarMetrics.length > 0 ? barGroupW / dollarMetrics.length : 0;
      months.forEach(function (mo, i) {
        var slotCenter = xFor(i);
        var groupStart = slotCenter - barGroupW / 2;
        dollarMetrics.forEach(function (k, ki) {
          var barX = groupStart + ki * barW;
          var v = mo[k];
          var y0 = yForDollar(0), y1 = yForDollar(v);
          var top = Math.min(y0, y1), h = Math.abs(y1 - y0);
          svg += '<rect x="' + barX + '" y="' + top + '" width="' + Math.max(barW - 1, 1) + '" height="' + Math.max(h, 0.5) + '" fill="' + metricDefs[k].color + '" rx="1"></rect>';
        });
      });
      if (countActive) {
        var ptsBar = months.map(function (mo, i) { return xFor(i) + ',' + yForCount(mo.rentals); }).join(' ');

  function setupDragReorder(containerSelector, itemAttr, getArray, storageKey) {
    var container = document.querySelector(containerSelector);
    if (!container) return;
    var LONG_PRESS_MS = 650;
    var MOVE_CANCEL_THRESHOLD = 8;

    Array.from(container.querySelectorAll('.bl-piling[' + itemAttr + ']')).forEach(function (tile) {
      var pressTimer = null;
      var moved = false;
      var startX = 0, startY = 0;

      function onMoveCheck(ev) {
        var dx = Math.abs(ev.clientX - startX), dy = Math.abs(ev.clientY - startY);
        if (dx > MOVE_CANCEL_THRESHOLD || dy > MOVE_CANCEL_THRESHOLD) {
          moved = true;
          clearTimeout(pressTimer);
          cleanupPreDrag();
        }
      }
      function onUpCheck() {
        clearTimeout(pressTimer);
        cleanupPreDrag();
      }
      function cleanupPreDrag() {
        document.removeEventListener('pointermove', onMoveCheck);
        document.removeEventListener('pointerup', onUpCheck);
      }

      tile.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        moved = false;
        startX = e.clientX; startY = e.clientY;
        document.addEventListener('pointermove', onMoveCheck);
        document.addEventListener('pointerup', onUpCheck);
        pressTimer = setTimeout(function () {
          cleanupPreDrag();
          if (!moved) startDrag(tile, e);
        }, LONG_PRESS_MS);
      });
    });

    function startDrag(tile, startEvent) {
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
      var rect = tile.getBoundingClientRect();
      var offsetX = startEvent.clientX - rect.left;
      var offsetY = startEvent.clientY - rect.top;

      var placeholder = document.createElement('div');
      placeholder.className = 'bl-drag-placeholder';
      placeholder.style.width = rect.width + 'px';
      placeholder.style.minWidth = rect.width + 'px';
      placeholder.style.height = rect.height + 'px';
      tile.parentNode.insertBefore(placeholder, tile.nextSibling);

      tile.classList.add('bl-dragging');
      tile.style.position = 'fixed';
      tile.style.zIndex = '999';
      tile.style.left = rect.left + 'px';
      tile.style.top = rect.top + 'px';
      tile.style.width = rect.width + 'px';
      document.body.appendChild(tile);

      function onMove(ev) {
        ev.preventDefault();
        tile.style.left = (ev.clientX - offsetX) + 'px';
        tile.style.top = (ev.clientY - offsetY) + 'px';
        var siblings = Array.from(container.querySelectorAll('.bl-piling[' + itemAttr + ']')).filter(function (s) { return s !== tile; });
        for (var i = 0; i < siblings.length; i++) {
          var r = siblings[i].getBoundingClientRect();
          if (ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom) {
            var before = ev.clientX < r.left + r.width / 2;
            if (before) siblings[i].parentNode.insertBefore(placeholder, siblings[i]);
            else siblings[i].parentNode.insertBefore(placeholder, siblings[i].nextSibling);
            break;
          }
        }
      }
      function onUp() {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        tile.classList.remove('bl-dragging');
        tile.style.position = '';
        tile.style.zIndex = '';
        tile.style.left = '';
        tile.style.top = '';
        tile.style.width = '';
        placeholder.parentNode.insertBefore(tile, placeholder);
        placeholder.remove();

        var newOrderIds = Array.from(container.querySelectorAll('.bl-piling[' + itemAttr + ']')).map(function (el) { return el.getAttribute(itemAttr); });
        var arr = getArray();
        var reordered = newOrderIds.map(function (id) { return arr.find(function (x) { return x.id === id; }); }).filter(Boolean);
        if (reordered.length === arr.length) {
          arr.length = 0;
          reordered.forEach(function (x) { arr.push(x); });
          storageSet(storageKey, arr);
        }
        render();
      }
      document.addEventListener('pointermove', onMove, { passive: false });
      document.addEventListener('pointerup', onUp);
    }
  }
