  function openCancelReasonModal(r, onCancelled) {
    var existing = document.getElementById('bl-cancel-reason-overlay');
    if (existing) existing.remove();
    var keepsDeposit = r.depositPaid && !r.yoodlize;
    var reasons = ['Weather', 'No show', 'Cancelled plans', 'Other'];
    var overlay = document.createElement('div');
    overlay.className = 'bl-overlay';
    overlay.id = 'bl-cancel-reason-overlay';
    overlay.style.zIndex = '10000';
    overlay.innerHTML =
      '<div class="bl-modal"><h2 style="margin-top:0;">Cancel rental</h2>' +
      (keepsDeposit ? '<p style="font-size:13.5px;color:#5B6E68;margin:0 0 12px;">You will keep the ' + fmtMoney(r.depositAmount) + ' non-refundable reservation deposit.</p>' : '') +
      '<div class="bl-field"><label>Reason for cancelling</label><div class="bl-cancel-reason-options">' +
      reasons.map(function (reason) { return '<button type="button" class="bl-cancel-reason-btn" data-reason="' + esc(reason) + '">' + esc(reason) + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="bl-field" id="bl-cancel-other-field" style="display:none;"><label>What happened</label><input id="bl-cancel-other-input" placeholder="Type the reason"></div>' +
      '<div class="bl-modal-actions">' +
      '<button type="button" class="bl-cancel-btn" id="bl-cancel-reason-close">Back</button>' +
      '<button type="button" class="bl-save-btn" id="bl-cancel-reason-confirm" disabled>Confirm cancellation</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
    var selectedReason = null;
    function dismiss() { overlay.remove(); }
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) dismiss(); });
    document.getElementById('bl-cancel-reason-close').addEventListener('click', dismiss);
    var confirmBtn = document.getElementById('bl-cancel-reason-confirm');
    var otherField = document.getElementById('bl-cancel-other-field');
    var otherInput = document.getElementById('bl-cancel-other-input');
    overlay.querySelectorAll('.bl-cancel-reason-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        overlay.querySelectorAll('.bl-cancel-reason-btn').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        selectedReason = btn.getAttribute('data-reason');
        if (selectedReason === 'Other') {
          otherField.style.display = '';
          otherInput.focus();
          confirmBtn.disabled = !otherInput.value.trim();
        } else {
          otherField.style.display = 'none';
          confirmBtn.disabled = false;
        }
      });
    });
    otherInput.addEventListener('input', function () {
      if (selectedReason === 'Other') confirmBtn.disabled = !otherInput.value.trim();
    });
    confirmBtn.addEventListener('click', function () {
      var reason = selectedReason === 'Other' ? otherInput.value.trim() : selectedReason;
      if (!reason) return;
      dismiss();
      onCancelled(reason);
    });
  }

  function openRentalModal(rental, presets) {
    closeModal();
    var isEdit = !!rental;
    var f = rental ? Object.assign({}, rental, { addons: (rental.addons || []).slice() }) : Object.assign({
      id: null, customerName: '', source: 'Facebook',
      itemId: state.inventory[0] ? state.inventory[0].id : '',
      qty: 1, startDate: '', endDate: '',
      price: '', depositPaid: true, safetyDeposit: '', notes: '', addons: [],
    }, presets || {});
    var selectedAddonIds = {};
    (f.addons || []).forEach(function (a) {
      var key = a.addonId || a.id;
      if (!selectedAddonIds[key]) selectedAddonIds[key] = [];
      selectedAddonIds[key].push(a);
    });

    var overlay = document.createElement('div');
    overlay.className = 'bl-overlay';
    overlay.id = 'bl-overlay';

    function sizeLineHtml(addon, selectedSize, qty) {
      var selectedAvail = 1;
      var placeholder = !selectedSize ? '<option value="" selected disabled>Select size…</option>' : '';
      var options = addon.sizes.map(function (s) {
        var avail = Math.max(addonSizeStock(addon, s) - addonOutForDateRange(addon.id, s, f.startDate, f.endDate, f.id), 0);
        if (s === selectedSize) selectedAvail = Math.max(avail, qty || 1);
        return '<option value="' + esc(s) + '"' + (s === selectedSize ? ' selected' : '') + (avail <= 0 && s !== selectedSize ? ' disabled' : '') + '>' + esc(s) + ' (' + avail + ' left)</option>';
      }).join('');
      return '<div class="bl-size-line" data-addon-id="' + addon.id + '">' +
        '<select class="bl-size-select">' + placeholder + options + '</select>' +
        '<input type="number" min="1" max="' + selectedAvail + '" class="bl-size-qty" value="' + (qty || 1) + '">' +
        '<button type="button" class="bl-size-remove" title="Remove">×</button>' +
        '</div>';
    }

    var addonPickerHtml = '';
    if (state.addons.length === 0) {
      addonPickerHtml = '<div class="bl-addon-picker-empty">No add-ons yet — add some from the Add-ons row on the main screen.</div>';
    } else {
      addonPickerHtml = state.addons.map(function (a) {
        var lines = selectedAddonIds[a.id] || [];
        var hasSizes = a.sizes && a.sizes.length > 0;
        var checked = lines.length > 0;
        var applies = addonAppliesTo(a, f.itemId);
        var avail = Math.max(addonStockTotal(a) - addonOutForDateRange(a.id, undefined, f.startDate, f.endDate, f.id), 0);
        var qtyMax = Math.max(avail, checked ? (lines[0].qty || 1) : 1);
        var block = '<div class="bl-addon-block" data-addon-id="' + a.id + '" data-item-ids="' + esc((a.itemIds || []).join(',')) + '"' + (applies ? '' : ' style="display:none;"') + '>';
        block += '<div class="bl-addon-picker-row">' +
          '<label><input type="checkbox" class="bl-addon-check" data-addon-id="' + a.id + '"' + (checked ? ' checked' : '') + (avail <= 0 && !checked ? ' disabled' : '') + '>' + esc(a.name) + '</label>' +
          '<span class="bl-addon-price">' + fmtMoney(a.price) + '/day · <span class="bl-addon-avail" data-addon-id="' + a.id + '">' + avail + ' left</span></span>' +
          (!hasSizes ? '<input type="number" min="1" max="' + qtyMax + '" class="bl-addon-qty" data-addon-id="' + a.id + '" value="' + (checked ? (lines[0].qty || 1) : 1) + '">' : '') +
          '</div>';
        if (hasSizes) {
          block += '<div class="bl-addon-sizes" data-addon-id="' + a.id + '"' + (checked ? '' : ' style="display:none;"') + '>';
          if (lines.length > 0) {
            lines.forEach(function (l) { block += sizeLineHtml(a, l.size, l.qty); });
          } else {
            block += sizeLineHtml(a, null, 1);
          }
          block += '</div>';
          block += '<button type="button" class="bl-addon-add-size" data-addon-id="' + a.id + '"' + (checked ? '' : ' style="display:none;"') + '>+ Add another size</button>';
        }
        block += '</div>';
        return block;
      }).join('');
    }

    overlay.innerHTML =
      '<div class="bl-modal"><h2>' + (isEdit ? 'Edit rental' : 'New rental') + '</h2>' +
      '<form id="bl-rental-form">' +
      '<div class="bl-row2">' +
      '<div class="bl-field"><label>Customer name</label><input name="customerName" value="' + esc(f.customerName) + '" required></div>' +
      '<div class="bl-field"><label>Contacted via</label><select name="source">' +
      ['', 'Facebook', 'KSL', 'Yoodlize'].map(function (s) { return '<option value="' + s + '"' + (s === (f.source || '') ? ' selected' : '') + '>' + (s || 'Select') + '</option>'; }).join('') +
      '</select></div>' +
      '</div>' +
      '<div class="bl-field"><label>Dates</label>' + dateRangePickerHtml(f.startDate, f.endDate) + '</div>' +
      '<div class="bl-row2">' +
      '<div class="bl-field"><label>Pick up time</label>' + timePickerHtml('pickupTime', f.pickupTime || '') + '</div>' +
      '<div class="bl-field"><label>Drop off time</label>' + timePickerHtml('dropoffTime', f.dropoffTime || '') + '</div>' +
      '</div>' +
      '<div class="bl-row2">' +
      '<div class="bl-field"><label>Item</label><select name="itemId" id="bl-item-select">' +
      state.inventory.map(function (i) { return '<option value="' + i.id + '"' + (i.id === f.itemId ? ' selected' : '') + '>' + esc(i.name) + ' — ' + fmtMoney(i.price) + '/day</option>'; }).join('') +
      '</select></div>' +
      '<div class="bl-field" id="bl-qty-field"><label>Quantity</label><input type="number" min="1" name="qty" id="bl-qty-input" value="' + esc(f.qty) + '"><div id="bl-qty-avail-note" class="bl-qty-avail-note"></div></div>' +
      '</div>' +
      '<div class="bl-field" id="bl-components-field" style="display:none;"><label>Pieces included</label><div class="bl-addon-picker" id="bl-components-picker"></div></div>' +
      '<div class="bl-field"><label>Add-ons</label><div class="bl-addon-picker" id="bl-addon-picker">' + addonPickerHtml + '</div></div>' +
      '<div class="bl-subtotal-row"><span id="bl-subtotal-text">Item + add-ons: ' + fmtMoney(0) + '</span></div>' +
      '<div class="bl-price-breakdown" id="bl-price-breakdown"></div>' +
      '<div class="bl-field" style="margin-top:11px;"><label>Total price ($)</label><input type="number" step="0.01" name="price" id="bl-price-input" value="' + esc(f.price) + '"></div>' +
      '<div class="bl-field bl-deposit-check-row"><label><input type="checkbox" id="bl-deposit-check" name="depositPaid"' + (f.depositPaid ? ' checked' : '') + '> Reservation deposit paid (' + fmtMoney(DEPOSIT_AMOUNT) + ')</label></div>' +
      '<div class="bl-field bl-deposit-check-row"><label><input type="checkbox" id="bl-yoodlize-check" name="yoodlize"' + (f.yoodlize ? ' checked' : '') + '> Paid with Yoodlize (deposits waived)</label></div>' +
      '<div class="bl-field bl-yoodlize-fee-field" id="bl-yoodlize-fee-field" style="' + (f.yoodlize ? '' : 'display:none;') + '"><label>Yoodlize fee ($ — 10% of total)</label><input type="number" step="0.01" min="0" name="yoodlizeFee" id="bl-yoodlize-fee-input" value="' + esc(f.yoodlizeFee || '') + '"></div>' +
      '<div class="bl-remaining-row" id="bl-remaining-row"></div>' +
      '<div class="bl-field"><label>Refundable safety deposit ($)</label><input type="number" step="0.01" name="safetyDeposit" id="bl-safety-input" value="' + esc(f.safetyDeposit) + '"></div>' +
      '<div class="bl-field"><label>Notes</label><input name="notes" value="' + esc(f.notes) + '" placeholder="Optional"></div>' +
      '<div class="bl-modal-actions">' +
      '<div><button type="button" class="bl-cancel-btn" id="bl-cancel">Cancel</button>' +
      (isEdit ? '<button type="button" class="bl-delete-btn" id="bl-delete" style="margin-left:12px;">Delete</button>' : '') +
      '</div>' +
      '<button type="submit" class="bl-save-btn">Save rental</button>' +
      '</div>' +
      '</form></div>';
    document.body.appendChild(overlay);
    overlay.querySelectorAll('.bl-wheel-time-wrapper').forEach(function (w) { initWheelTimePicker(w); });
    overlay.querySelectorAll('.bl-daterange-wrapper').forEach(function (w) { initDateRangePicker(w); });

    function addOneHour(timeStr) {
      var parts = timeStr.split(':');
      var h = Number(parts[0]) + 1;
      if (h > 23) h = 23;
      return (h < 10 ? '0' + h : '' + h) + ':' + parts[1];
    }
    function isSameDayRental() {
      var s = overlay.querySelector('input[name="startDate"]').value;
      var e = overlay.querySelector('input[name="endDate"]').value;
      return s && e && s === e;
    }
    var pickupHiddenInput = overlay.querySelector('input[name="pickupTime"]');
    var dropoffHiddenInput = overlay.querySelector('input[name="dropoffTime"]');
    var pickupWrapperEl = pickupHiddenInput ? pickupHiddenInput.closest('.bl-wheel-time-wrapper') : null;
    var dropoffWrapper = dropoffHiddenInput ? dropoffHiddenInput.closest('.bl-wheel-time-wrapper') : null;
    var autoDropoffTime = !isEdit;
    if (pickupHiddenInput && dropoffHiddenInput && pickupWrapperEl && dropoffWrapper) {
      dropoffWrapper._onUserChange = function () { autoDropoffTime = false; };
      pickupHiddenInput.addEventListener('change', function () {
        if (!pickupHiddenInput.value) return;
        if (isSameDayRental()) {
          if (!dropoffHiddenInput.value || dropoffHiddenInput.value <= pickupHiddenInput.value) {
            dropoffWrapper._setTimeValue(addOneHour(pickupHiddenInput.value));
          }
        } else if (autoDropoffTime) {
          dropoffWrapper._setTimeValue(pickupHiddenInput.value);
        }
      });
      dropoffWrapper._onClose = function () {
        if (!isSameDayRental() || !pickupHiddenInput.value) return;
        if (dropoffHiddenInput.value && dropoffHiddenInput.value <= pickupHiddenInput.value) {
          dropoffWrapper._setTimeValue(addOneHour(pickupHiddenInput.value), { silent: true });
        }
      };
      var pickupDoneBtn = pickupWrapperEl.querySelector('.bl-time-done-btn');
      if (pickupDoneBtn) {
        pickupDoneBtn.addEventListener('click', function () {
          var dropoffTrigger = dropoffWrapper.querySelector('.bl-time-trigger');
          if (dropoffTrigger) dropoffTrigger.click();
        });
      }
    }

    var autoPrice = !isEdit;
    var autoSafety = !isEdit;
    var autoYoodlizeFee = !isEdit;

    function computeSubtotal() {
      var itemId = document.getElementById('bl-item-select').value;
      var qty = Number(document.getElementById('bl-qty-input').value) || 0;
      var originalRequestedQty = qty;
      var startDate = overlay.querySelector('input[name="startDate"]').value;
      var endDate = overlay.querySelector('input[name="endDate"]').value;
      var pickupTimeVal = overlay.querySelector('input[name="pickupTime"]').value;
      var dropoffTimeVal = overlay.querySelector('input[name="dropoffTime"]').value;
      var days = rentalDays(startDate, endDate, pickupTimeVal, dropoffTimeVal);
      var item = state.inventory.find(function (i) { return i.id === itemId; });
      var hasComponents = item && item.components && item.components.length > 0;
      if (item && !hasComponents && startDate && endDate) {
        var qtyInputEarly = document.getElementById('bl-qty-input');
        var earlyAvail = Math.max(item.total - itemOutForCandidate(item.id, { startDate: startDate, endDate: endDate, pickupTime: pickupTimeVal, dropoffTime: dropoffTimeVal }, f.id), 0);
        if (qty > earlyAvail && document.activeElement !== qtyInputEarly) {
          qty = earlyAvail;
          qtyInputEarly.value = earlyAvail;
        }
      }
      var itemTotal, itemLabel;
      if (hasComponents) {
        var compSum = 0, selectedNames = [], selectedCount = 0;
        item.components.forEach(function (c) {
          var chk = overlay.querySelector('.bl-component-check[data-component-id="' + c.id + '"]');
          if (chk && chk.checked) { compSum += Number(c.price) || 0; selectedNames.push(c.name); selectedCount++; }
        });
        var isFullSetup = selectedCount === item.components.length;
        itemTotal = (isFullSetup ? Number(item.price) || 0 : compSum) * days;
        itemLabel = isFullSetup ? item.name : (selectedNames.length ? selectedNames.join(' + ') : item.name);
      } else {
        itemTotal = (item ? Number(item.price) || 0 : 0) * qty * days;
        itemLabel = item ? qty + 'x ' + item.name : 'Item';
      }
      var addonsTotal = 0;
      var addonLines = [];
      state.addons.forEach(function (a) {
        var checkbox = overlay.querySelector('.bl-addon-check[data-addon-id="' + a.id + '"]');
        if (!checkbox || !checkbox.checked) return;
        if (a.sizes && a.sizes.length > 0) {
          overlay.querySelectorAll('.bl-size-line[data-addon-id="' + a.id + '"]').forEach(function (line) {
            var size = line.querySelector('.bl-size-select').value;
            var q = Number(line.querySelector('.bl-size-qty').value) || 1;
            var amt = (Number(a.price) || 0) * q * days;
            addonsTotal += amt;
            addonLines.push({ label: a.name + (size ? ' (' + size + ')' : '') + (q > 1 ? ' x' + q : ''), amount: amt });
          });
        } else {
          var qtyInput = overlay.querySelector('.bl-addon-qty[data-addon-id="' + a.id + '"]');
          var q = Number(qtyInput ? qtyInput.value : 1) || 1;
          var amt = (Number(a.price) || 0) * q * days;
          addonsTotal += amt;
          addonLines.push({ label: a.name + (q > 1 ? ' x' + q : ''), amount: amt });
        }
      });
      var total = itemTotal + addonsTotal;
      var dayLabel = days === 1 ? '1 day' : days + ' days';
      var addonNamesText = addonLines.length > 0 ? ' + ' + addonLines.map(function (l) { return l.label; }).join(', ') : '';
      document.getElementById('bl-subtotal-text').textContent =
        itemLabel + ' × ' + dayLabel + addonNamesText + ': ' + fmtMoney(total);
      var itemBreakdownLabel = hasComponents ? itemLabel : (item ? item.name + (qty > 1 ? ' x' + qty : '') : itemLabel);
      var breakdownHtml = '<div class="bl-breakdown-line"><span>' + esc(itemBreakdownLabel) + '</span><span>' + fmtMoney(itemTotal) + '</span></div>';
      addonLines.forEach(function (l) {
        breakdownHtml += '<div class="bl-breakdown-line"><span>' + esc(l.label) + '</span><span>' + fmtMoney(l.amount) + '</span></div>';
      });
      breakdownHtml += '<div class="bl-breakdown-line bl-breakdown-total"><span>Total price</span><span>' + fmtMoney(total) + '</span></div>';
      document.getElementById('bl-price-breakdown').innerHTML = breakdownHtml;
      if (autoPrice) document.getElementById('bl-price-input').value = total.toFixed(2);
      if (autoSafety) {
        var yoodlizeOn = document.getElementById('bl-yoodlize-check').checked;
        var safetyCalc = yoodlizeOn ? 0 : Math.min((item ? Number(item.safetyDepositRate) || 0 : 0) * qty, SAFETY_DEPOSIT_CAP);
        overlay.querySelector('input[name="safetyDeposit"]').value = safetyCalc.toFixed(2);
      }
      recalcYoodlizeFee();
      updateRemainingDisplay();
      refreshAddonAvailabilityDisplay(startDate, endDate);
      if (item) refreshComponentsAvailabilityDisplay(item, startDate, endDate);
      if (item && !hasComponents) {
        var qtyInput2 = document.getElementById('bl-qty-input');
        var alreadyOut = itemOutForCandidate(item.id, { startDate: startDate, endDate: endDate, pickupTime: pickupTimeVal, dropoffTime: dropoffTimeVal }, f.id);
        var itemAvail = Math.max(item.total - alreadyOut, 0);
        qtyInput2.max = itemAvail;
        if (qty > itemAvail && document.activeElement !== qtyInput2) {
          qtyInput2.value = itemAvail;
          qty = itemAvail;
        }
        var qtyNote = document.getElementById('bl-qty-avail-note');
        if (qtyNote) {
          if (!startDate || !endDate) {
            qtyNote.textContent = '';
          } else {
            var checkDateForUntil = startDate;
            var outThatDay = itemOutOnDate(item.id, checkDateForUntil, f.id);
            var availThatDay = Math.max(item.total - outThatDay, 0);
            var returnBuckets = returnBucketsForItemDay(item.id, checkDateForUntil, f.id);
            if (returnBuckets.length > 0) {
              var parts = [availThatDay + ' available all day'];
              returnBuckets.forEach(function (b) { parts.push(b.qty + ' must be returned by ' + fmtTime(b.time)); });
              qtyNote.textContent = parts.join('. ') + '.';
              qtyNote.className = 'bl-qty-avail-note ' + (originalRequestedQty <= itemAvail ? 'bl-qty-avail-ok' : 'bl-qty-avail-none');
            } else if (originalRequestedQty <= itemAvail) {
              qtyNote.textContent = itemAvail + ' of ' + item.total + ' available for these dates';
              qtyNote.className = 'bl-qty-avail-note bl-qty-avail-ok';
            } else {
              var shortfalls = itemShortfallDays(item.id, startDate, endDate, originalRequestedQty, f.id);
              var dayList = shortfalls.length > 0 ? shortfalls.map(function (s) { return fmtDate(s.date); }).join(', ') : (fmtDate(startDate) + ' – ' + fmtDate(endDate));
              var worstAvail = shortfalls.length > 0 ? Math.min.apply(null, shortfalls.map(function (s) { return s.avail; })) : itemAvail;
              var baseMsg = worstAvail <= 0
                ? 'No ' + item.name.toLowerCase() + 's left on ' + dayList
                : 'Only ' + worstAvail + ' available on ' + dayList;
              var freeUp = shortfalls.length === 1 ? itemFreeUpTime(item.id, shortfalls[0].date, originalRequestedQty, f.id) : null;
              qtyNote.textContent = baseMsg + (freeUp ? ' — ' + originalRequestedQty + ' available after ' + fmtTime(freeUp.time) : '');
              qtyNote.className = 'bl-qty-avail-note bl-qty-avail-none';
            }
          }
        }
      }
      return total;
    }

    function refreshComponentsAvailabilityDisplay(item, startDate, endDate) {
      if (!item.components || item.components.length === 0) return;
      item.components.forEach(function (c) {
        var chk = overlay.querySelector('.bl-component-check[data-component-id="' + c.id + '"]');
        if (!chk) return;
        var out = componentOutForDateRange(item.id, c.id, startDate, endDate, f.id);
        var avail = Math.max(1 - out, 0);
        if (avail <= 0 && chk.checked) chk.checked = false;
        chk.disabled = avail <= 0;
        var row = chk.closest('.bl-addon-picker-row');
        if (row) row.style.opacity = avail <= 0 ? '0.5' : '';
        var priceSpan = overlay.querySelector('.bl-component-status[data-component-id="' + c.id + '"]');
        if (priceSpan) priceSpan.textContent = fmtMoney(c.price) + '/day' + (avail <= 0 ? ' · booked' : '');
      });
    }

    function renderComponentsPickerHtml(item, selectedIds, startDate, endDate) {
      return item.components.map(function (c) {
        var out = componentOutForDateRange(item.id, c.id, startDate, endDate, f.id);
        var avail = Math.max(1 - out, 0);
        var checked = selectedIds.indexOf(c.id) !== -1;
        var disabled = avail <= 0 && !checked;
        return '<div class="bl-addon-picker-row"><label' + (disabled ? ' style="opacity:0.5;"' : '') + '>' +
          '<input type="checkbox" class="bl-component-check" data-component-id="' + c.id + '"' + (checked ? ' checked' : '') + (disabled ? ' disabled' : '') + '>' + esc(c.name) + '</label>' +
          '<span class="bl-addon-price bl-component-status" data-component-id="' + c.id + '">' + fmtMoney(c.price) + '/day' + (avail <= 0 ? ' · booked' : '') + '</span></div>';
      }).join('');
    }

    function applyComponentsVisibility(item, selectedIds) {
      var field = document.getElementById('bl-components-field');
      var picker = document.getElementById('bl-components-picker');
      var qtyField = document.getElementById('bl-qty-field');
      var startDate = overlay.querySelector('input[name="startDate"]').value;
      var endDate = overlay.querySelector('input[name="endDate"]').value;
      if (item && item.components && item.components.length > 0) {
        field.style.display = '';
        qtyField.style.display = 'none';
        document.getElementById('bl-qty-input').value = 1;
        picker.innerHTML = renderComponentsPickerHtml(item, selectedIds, startDate, endDate);
      } else {
        field.style.display = 'none';
        qtyField.style.display = '';
        picker.innerHTML = '';
      }
    }

    function refreshAddonAvailabilityDisplay(startDate, endDate) {
      state.addons.forEach(function (a) {
        if (a.sizes && a.sizes.length > 0) {
          var lines = Array.from(overlay.querySelectorAll('.bl-size-line[data-addon-id="' + a.id + '"]'));
          function claimedBySiblings(sizeValue, excludeIdx) {
            var claimed = 0;
            lines.forEach(function (otherLine, otherIdx) {
              if (otherIdx === excludeIdx) return;
              var otherSel = otherLine.querySelector('.bl-size-select');
              var otherQty = Number(otherLine.querySelector('.bl-size-qty').value) || 0;
              if (otherSel.value === sizeValue) claimed += otherQty;
            });
            return claimed;
          }
          lines.forEach(function (line, idx) {
            var sel = line.querySelector('.bl-size-select');
            var qtyInput = line.querySelector('.bl-size-qty');
            Array.from(sel.options).forEach(function (opt) {
              if (!opt.value) return;
              var savedAvail = Math.max(addonSizeStock(a, opt.value) - addonOutForDateRange(a.id, opt.value, startDate, endDate, f.id), 0);
              var avail = Math.max(savedAvail - claimedBySiblings(opt.value, idx), 0);
              opt.textContent = opt.value + ' (' + avail + ' left)';
              opt.disabled = avail <= 0 && !opt.selected;
            });
            var selectedOpt = sel.options[sel.selectedIndex];
            var selectedAvail = 0;
            if (selectedOpt && selectedOpt.value) {
              var savedAvailSel = Math.max(addonSizeStock(a, selectedOpt.value) - addonOutForDateRange(a.id, selectedOpt.value, startDate, endDate, f.id), 0);
              selectedAvail = Math.max(savedAvailSel - claimedBySiblings(selectedOpt.value, idx), 0);
            }
            qtyInput.max = Math.max(selectedAvail, Number(qtyInput.value) || 1);
          });
        } else {
          var availSpan = overlay.querySelector('.bl-addon-avail[data-addon-id="' + a.id + '"]');
          var checkbox = overlay.querySelector('.bl-addon-check[data-addon-id="' + a.id + '"]');
          var qtyInput2 = overlay.querySelector('.bl-addon-qty[data-addon-id="' + a.id + '"]');
          var avail = Math.max(addonStockTotal(a) - addonOutForDateRange(a.id, undefined, startDate, endDate, f.id), 0);
          if (availSpan) availSpan.textContent = avail + ' left';
          if (checkbox) checkbox.disabled = avail <= 0 && !checkbox.checked;
          if (qtyInput2) qtyInput2.max = Math.max(avail, Number(qtyInput2.value) || 1);
        }
      });
    }

    function recalcYoodlizeFee() {
      if (!autoYoodlizeFee) return;
      var yoodlizeOn = document.getElementById('bl-yoodlize-check').checked;
      if (!yoodlizeOn) return;
      var priceVal = Number(document.getElementById('bl-price-input').value) || 0;
      document.getElementById('bl-yoodlize-fee-input').value = (priceVal * YOODLIZE_FEE_RATE).toFixed(2);
    }

    function applyYoodlizeState(isUserToggle) {
      var on = document.getElementById('bl-yoodlize-check').checked;
      var depositCheck = document.getElementById('bl-deposit-check');
      var safetyInput = overlay.querySelector('input[name="safetyDeposit"]');
      var feeField = document.getElementById('bl-yoodlize-fee-field');
      if (on) {
        depositCheck.checked = false;
        safetyInput.value = '0.00';
        safetyInput.readOnly = true;
        if (feeField) feeField.style.display = '';
        if (isUserToggle) { autoYoodlizeFee = true; }
        recalcYoodlizeFee();
      } else {
        safetyInput.readOnly = false;
        if (feeField) feeField.style.display = 'none';
        if (isUserToggle) { autoSafety = true; computeSubtotal(); }
      }
      updateRemainingDisplay();
    }

    function updateRemainingDisplay() {
      var price = Number(document.getElementById('bl-price-input').value) || 0;
      var yoodlizeOn = document.getElementById('bl-yoodlize-check').checked;
      if (yoodlizeOn) {
        document.getElementById('bl-remaining-row').textContent = 'Due at pickup: ' + fmtMoney(price) + ' (deposits waived — paid via Yoodlize)';
        return;
      }
      var depositChecked = document.getElementById('bl-deposit-check').checked;
      var safety = Number(overlay.querySelector('input[name="safetyDeposit"]').value) || 0;
      var remaining = Math.max(price - (depositChecked ? DEPOSIT_AMOUNT : 0), 0) + safety;
      var text = depositChecked
        ? 'Remaining due at pickup: ' + fmtMoney(remaining)
        : 'Due at pickup: ' + fmtMoney(price + safety) + ' + ' + fmtMoney(DEPOSIT_AMOUNT) + ' reservation deposit';
      if (safety > 0) text += ' (includes ' + fmtMoney(safety) + ' refundable safety deposit)';
      document.getElementById('bl-remaining-row').textContent = text;
    }
    var initialItemForComponents = state.inventory.find(function (i) { return i.id === f.itemId; });
    var initialComponentIds = f.components || availableComponentIds(initialItemForComponents, f.startDate, f.endDate, f.id);
    if (initialItemForComponents) applyComponentsVisibility(initialItemForComponents, initialComponentIds);
    computeSubtotal();
    applyYoodlizeState(false);
    document.getElementById('bl-yoodlize-check').addEventListener('change', function () { applyYoodlizeState(true); });
    document.getElementById('bl-deposit-check').addEventListener('change', function (e) {
      if (e.target.checked) {
        var yoodlizeCheck = document.getElementById('bl-yoodlize-check');
        if (yoodlizeCheck.checked) {
          yoodlizeCheck.checked = false;
          applyYoodlizeState(true);
        }
      }
    });

    overlay.addEventListener('input', function (e) {
      if (e.target.id === 'bl-price-input') {
        autoPrice = (e.target.value === '');
        recalcYoodlizeFee();
        updateRemainingDisplay();
        return;
      }
      if (e.target.id === 'bl-safety-input') {
        autoSafety = (e.target.value === '');
        updateRemainingDisplay();
        return;
      }
      if (e.target.id === 'bl-yoodlize-fee-input') {
        autoYoodlizeFee = (e.target.value === '');
        if (autoYoodlizeFee) recalcYoodlizeFee();
        return;
      }
      if (e.target.classList.contains('bl-size-qty') || e.target.classList.contains('bl-addon-qty') || e.target.id === 'bl-qty-input') {
        var maxVal = Number(e.target.max);
        if (maxVal > 0 && Number(e.target.value) > maxVal) e.target.value = maxVal;
      }
      computeSubtotal();
    });
    overlay.addEventListener('change', function (e) {
      if (e.target.name === 'source') {
        if (e.target.value === 'Yoodlize') {
          var yc = document.getElementById('bl-yoodlize-check');
          if (!yc.checked) { yc.checked = true; applyYoodlizeState(true); }
        }
      }
      if (e.target.id === 'bl-item-select') {
        var selItemId = e.target.value;
        overlay.querySelectorAll('.bl-addon-block').forEach(function (block) {
          var ids = block.getAttribute('data-item-ids');
          var idList = ids ? ids.split(',').filter(Boolean) : [];
          var applies = idList.length === 0 || idList.indexOf(selItemId) !== -1;
          block.style.display = applies ? '' : 'none';
        });
        var newItem = state.inventory.find(function (i) { return i.id === selItemId; });
        var curStartDate = overlay.querySelector('input[name="startDate"]').value;
        var curEndDate = overlay.querySelector('input[name="endDate"]').value;
        var defaultComponentIds = availableComponentIds(newItem, curStartDate, curEndDate, f.id);
        applyComponentsVisibility(newItem, defaultComponentIds);
      }
      if (e.target.classList.contains('bl-addon-check')) {
        var aId = e.target.getAttribute('data-addon-id');
        var addon = state.addons.find(function (a) { return a.id === aId; });
        var sizesContainer = overlay.querySelector('.bl-addon-sizes[data-addon-id="' + aId + '"]');
        var addBtn = overlay.querySelector('.bl-addon-add-size[data-addon-id="' + aId + '"]');
        if (sizesContainer) {
          if (e.target.checked) {
            sizesContainer.style.display = '';
            if (addBtn) addBtn.style.display = '';
            if (sizesContainer.children.length === 0 && addon) {
              sizesContainer.insertAdjacentHTML('beforeend', sizeLineHtml(addon, null, 1));
            }
          } else {
            sizesContainer.style.display = 'none';
            if (addBtn) addBtn.style.display = 'none';
          }
        }
      }
      computeSubtotal();
    });
    overlay.addEventListener('click', function (e) {
      if (e.target.classList.contains('bl-addon-add-size')) {
        var aId = e.target.getAttribute('data-addon-id');
        var addon = state.addons.find(function (a) { return a.id === aId; });
        var sizesContainer = overlay.querySelector('.bl-addon-sizes[data-addon-id="' + aId + '"]');
        if (addon && sizesContainer) sizesContainer.insertAdjacentHTML('beforeend', sizeLineHtml(addon, null, 1));
        computeSubtotal();
      }
      if (e.target.classList.contains('bl-size-remove')) {
        var line = e.target.closest('.bl-size-line');
        var lAid = line.getAttribute('data-addon-id');
        line.remove();
        var remaining = overlay.querySelectorAll('.bl-size-line[data-addon-id="' + lAid + '"]');
        if (remaining.length === 0) {
          var checkbox2 = overlay.querySelector('.bl-addon-check[data-addon-id="' + lAid + '"]');
          if (checkbox2) checkbox2.checked = false;
          var sc = overlay.querySelector('.bl-addon-sizes[data-addon-id="' + lAid + '"]');
          if (sc) sc.style.display = 'none';
          var ab = overlay.querySelector('.bl-addon-add-size[data-addon-id="' + lAid + '"]');
          if (ab) ab.style.display = 'none';
        }
        computeSubtotal();
      }
    });

    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) closeModal(); });
    document.getElementById('bl-cancel').addEventListener('click', closeModal);
    if (isEdit) document.getElementById('bl-delete').addEventListener('click', function () {
      customConfirm('Delete this rental?', function () {
        state.rentals = state.rentals.filter(function (r) { return r.id !== rental.id; });
        storageSet('rentals', state.rentals);
        closeModal();
        render();
      });
    });

    document.getElementById('bl-rental-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      var startDateCheck = fd.get('startDate');
      var endDateCheck = fd.get('endDate');
      if (startDateCheck && endDateCheck && endDateCheck < startDateCheck) {
        customAlert('The end date (' + fmtDate(endDateCheck) + ') is before the start date (' + fmtDate(startDateCheck) + '). Please fix the dates before saving.');
        return;
      }
      var chosenItemId = fd.get('itemId');
      var selectedAddons = [];
      var missingSize = [];
      state.addons.forEach(function (a) {
        if (!addonAppliesTo(a, chosenItemId)) return;
        var checkbox = overlay.querySelector('.bl-addon-check[data-addon-id="' + a.id + '"]');
        if (!checkbox || !checkbox.checked) return;
        if (a.sizes && a.sizes.length > 0) {
          overlay.querySelectorAll('.bl-size-line[data-addon-id="' + a.id + '"]').forEach(function (line) {
            var size = line.querySelector('.bl-size-select').value;
            var q = Number(line.querySelector('.bl-size-qty').value) || 1;
            if (!size) { missingSize.push(a.name); return; }
            selectedAddons.push({ addonId: a.id, name: a.name, price: a.price, size: size, qty: q });
          });
        } else {
          var qtyInput = overlay.querySelector('.bl-addon-qty[data-addon-id="' + a.id + '"]');
          var q = Number(qtyInput ? qtyInput.value : 1) || 1;
          selectedAddons.push({ addonId: a.id, name: a.name, price: a.price, size: null, qty: q });
        }
      });
      if (missingSize.length > 0) {
        customAlert('Please pick a size for: ' + missingSize.join(', ') + '.');
        return;
      }

      var submittedStartDate = fd.get('startDate');
      var submittedEndDate = fd.get('endDate');
      var overages = [];
      var totalsByKey = {};
      selectedAddons.forEach(function (line) {
        var key = line.addonId + (line.size ? '::' + line.size : '');
        totalsByKey[key] = (totalsByKey[key] || 0) + line.qty;
      });
      Object.keys(totalsByKey).forEach(function (key) {
        var parts = key.split('::');
        var addonId = parts[0], size = parts[1];
        var addon = state.addons.find(function (a) { return a.id === addonId; });
        if (!addon) return;
        var avail = size
          ? Math.max(addonSizeStock(addon, size) - addonOutForDateRange(addonId, size, submittedStartDate, submittedEndDate, f.id), 0)
          : Math.max(addonStockTotal(addon) - addonOutForDateRange(addonId, undefined, submittedStartDate, submittedEndDate, f.id), 0);
        if (totalsByKey[key] > avail) overages.push(addon.name + (size ? ' (' + size + ')' : '') + ' (' + totalsByKey[key] + ' requested, ' + avail + ' available for those dates)');
      });
      if (overages.length > 0) {
        customAlert('Not enough on hand for these dates: ' + overages.join(', ') + '. Adjust the quantity, size, or dates before saving.');
        return;
      }

      var chosenItem = state.inventory.find(function (i) { return i.id === chosenItemId; });
      var hasItemComponents = chosenItem && chosenItem.components && chosenItem.components.length > 0;
      if (chosenItem && !hasItemComponents) {
        var requestedQty = Number(fd.get('qty')) || 1;
        var candidateForSubmit = { startDate: submittedStartDate, endDate: submittedEndDate, pickupTime: fd.get('pickupTime'), dropoffTime: fd.get('dropoffTime') };
        var preciseOut = itemOutForCandidate(chosenItem.id, candidateForSubmit, f.id);
        var preciseAvail = Math.max(chosenItem.total - preciseOut, 0);
        if (requestedQty > preciseAvail) {
          var shortfallDays = itemShortfallDays(chosenItem.id, submittedStartDate, submittedEndDate, requestedQty, f.id);
          var dayListDays = shortfallDays.length > 0 ? shortfallDays.map(function (s) { return fmtDate(s.date); }).join(', ') : (fmtDate(submittedStartDate) + ' – ' + fmtDate(submittedEndDate));
          customAlert('Not enough ' + chosenItem.name + ' on hand: ' + requestedQty + ' requested, but only ' + preciseAvail + ' available on ' + dayListDays + '. Adjust the quantity, dates, or times before saving.');
          return;
        }
      }

      var selectedComponentIds = [];
      if (chosenItem && chosenItem.components && chosenItem.components.length > 0) {
        chosenItem.components.forEach(function (c) {
          var chk = overlay.querySelector('.bl-component-check[data-component-id="' + c.id + '"]');
          if (chk && chk.checked) selectedComponentIds.push(c.id);
        });
        if (selectedComponentIds.length === 0) {
          customAlert('Please select at least one piece of ' + chosenItem.name + '.');
          return;
        }
        var componentOverages = [];
        chosenItem.components.forEach(function (c) {
          if (selectedComponentIds.indexOf(c.id) === -1) return;
          var out = componentOutForDateRange(chosenItem.id, c.id, fd.get('startDate'), fd.get('endDate'), f.id);
          if (out >= 1) componentOverages.push(c.name);
        });
        if (componentOverages.length > 0) {
          customAlert('Already booked for these dates: ' + componentOverages.join(', ') + '. Adjust the dates or deselect that piece.');
          return;
        }
      }

      var data = {
        customerName: fd.get('customerName').trim(),
        source: fd.get('source') || '',
        itemId: fd.get('itemId'),
        qty: Number(fd.get('qty')) || 1,
        components: selectedComponentIds.length > 0 ? selectedComponentIds : undefined,
        startDate: fd.get('startDate'),
        endDate: fd.get('endDate'),
        pickupTime: fd.get('pickupTime'),
        dropoffTime: fd.get('dropoffTime'),
        price: Number(fd.get('price')) || 0,
        depositAmount: DEPOSIT_AMOUNT,
        depositPaid: fd.get('depositPaid') === 'on',
        yoodlize: fd.get('yoodlize') === 'on',
        safetyDeposit: Number(fd.get('safetyDeposit')) || 0,
        notes: fd.get('notes').trim(),
        addons: selectedAddons,
      };
      if (data.yoodlize) {
        data.depositAmount = 0;
        data.depositPaid = false;
        data.safetyDeposit = 0;
        data.yoodlizeFee = Number(fd.get('yoodlizeFee')) || 0;
      } else {
        data.yoodlizeFee = 0;
      }
      if (!data.customerName) { customAlert('Add a customer name.'); return; }
      if (isEdit) {
        Object.assign(rental, data);
      } else {
        state.rentals.push(Object.assign({
          id: uid(), depositPaid: true, pickedUp: false, itemReturned: false, depositRefunded: false,
        }, data));
      }
      storageSet('rentals', state.rentals);
      closeModal();
      render();
    });
  }

      '<div class="bl-field"><label>Safety deposit ($ per unit, capped at ' + fmtMoney(SAFETY_DEPOSIT_CAP) + ')</label><input type="number" step="0.01" min="0" name="safetyDepositRate" value="' + esc(f.safetyDepositRate) + '"></div>' +

      '<button type="submit" class="bl-save-btn">' + (isEdit ? 'Save' : 'Add') + '</button>' +
      '</div></form></div>';
    document.body.appendChild(overlay);

    function renderComponentRows() {
      var list = document.getElementById('bl-components-list');
      list.innerHTML = components.map(function (c, idx) {
        return '<div class="bl-row2" style="margin-bottom:8px;" data-comp-idx="' + idx + '">' +
          '<input type="text" class="bl-comp-name" placeholder="e.g. Projector" value="' + esc(c.name) + '">' +
          '<div style="display:flex;gap:6px;"><input type="number" step="0.01" min="0" class="bl-comp-price" placeholder="$/day" value="' + esc(c.price) + '" style="flex:1;">' +
          '<button type="button" class="bl-size-remove bl-comp-remove" data-idx="' + idx + '" title="Remove">×</button></div>' +
          '</div>';
      }).join('') || '<div class="bl-addon-picker-empty">No pieces added yet.</div>';
      list.querySelectorAll('.bl-comp-name').forEach(function (inp, idx) {

  function bindDetailModalActions(overlay, r) {
    var editBtn = overlay.querySelector('[data-action="edit-rental"]');
    if (editBtn) editBtn.addEventListener('click', function () {
      closeModal();
      openRentalModal(r);
    });
    overlay.querySelectorAll('[data-action="undo-step"]').forEach(function (dot) {
      dot.addEventListener('click', function () {
        var step = dot.getAttribute('data-step');
        var idx = STEPS.findIndex(function (s) { return s.key === step; });
        var laterDone = STEPS.slice(idx + 1).some(function (s) { return r[s.key]; });
        var msg = 'Undo "' + STEPS[idx].label + '"?' + (laterDone ? ' This will also undo the later steps after it.' : '');
        customConfirm(msg, function () {
          for (var j = idx; j < STEPS.length; j++) { r[STEPS[j].key] = false; }
          if (step === 'itemReturned') r.depositRefunded = false;
          storageSet('rentals', state.rentals);
          render();
          openRentalDetailModal(r);
        });
      });
    });
    var cancelBtn = overlay.querySelector('[data-action="cancel-rental"]');
    if (cancelBtn) cancelBtn.addEventListener('click', function () {
      openCancelReasonModal(r, function (reason) {
        r.cancelled = true;
        r.cancelReason = reason;
        storageSet('rentals', state.rentals);
        render();
        openRentalDetailModal(r);
      });
    });
    var advanceBtn = overlay.querySelector('[data-action="advance"]');
    if (advanceBtn) advanceBtn.addEventListener('click', function () {
      var step = advanceBtn.getAttribute('data-step');
      r[step] = true;
      if (step === 'itemReturned') r.depositRefunded = true;
      storageSet('rentals', state.rentals);
      render();
      openRentalDetailModal(r);
    });
  }

      '<div class="bl-field" id="bl-hist-count-field"' + (category === 'other' ? ' style="display:none;"' : '') + '><label>Number of rentals</label><input type="number" min="0" name="rentalCount" value="' + esc(f.rentalCount) + '"></div>' +
      '</div>' +
      '<div class="bl-field"><label id="bl-hist-revenue-label">' + (category === 'other' ? 'Amount ($)' : 'Revenue for that period ($)') + '</label>' +
      '<div class="bl-cancel-reason-options" style="margin-bottom:8px;">' +
      '<button type="button" class="bl-cancel-reason-btn' + (revenueSign === 1 ? ' selected' : '') + '" data-sign="1">+ Profit</button>' +
      '<button type="button" class="bl-cancel-reason-btn' + (revenueSign === -1 ? ' selected' : '') + '" data-sign="-1">− Loss</button>' +
      '</div>' +
      '<input type="number" step="0.01" min="0" name="revenue" value="' + esc(Math.abs(Number(f.revenue) || 0) || '') + '"></div>' +
      '<div class="bl-modal-actions">' +
      '<div><button type="button" class="bl-cancel-btn" id="bl-cancel">Cancel</button>' +
      (isEdit ? '<button type="button" class="bl-delete-btn" id="bl-delete-historical" style="margin-left:12px;">Delete</button>' : '') +
      '</div>' +
      '<button type="submit" class="bl-save-btn">' + (isEdit ? 'Save' : 'Add') + '</button>' +
      '</div></form></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) closeModal(); });
    document.getElementById('bl-cancel').addEventListener('click', closeModal);
    overlay.querySelectorAll('.bl-cancel-reason-btn[data-category]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        category = btn.getAttribute('data-category');
        overlay.querySelectorAll('.bl-cancel-reason-btn[data-category]').forEach(function (b) { b.classList.toggle('selected', b === btn); });
        var isOther = category === 'other';
        document.getElementById('bl-hist-item-field').style.display = isOther ? 'none' : '';
        document.getElementById('bl-hist-desc-field').style.display = isOther ? '' : 'none';
        document.getElementById('bl-hist-count-field').style.display = isOther ? 'none' : '';
        document.getElementById('bl-hist-revenue-label').textContent = isOther ? 'Amount ($)' : 'Revenue for that period ($)';
        document.getElementById('bl-hist-hint').style.display = isOther ? 'none' : '';
      });
    });
    overlay.querySelectorAll('.bl-cancel-reason-btn[data-sign]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        revenueSign = Number(btn.getAttribute('data-sign'));
        overlay.querySelectorAll('.bl-cancel-reason-btn[data-sign]').forEach(function (b) { b.classList.toggle('selected', b === btn); });
      });
    });
    if (isEdit) document.getElementById('bl-delete-historical').addEventListener('click', function () {
      customConfirm('Delete this manual total?', function () {
        state.historicalAdjustments = state.historicalAdjustments.filter(function (h) { return h.id !== entry.id; });
        storageSet('historicalAdjustments', state.historicalAdjustments);
        closeModal();
        render();
      });
    });
    document.getElementById('bl-historical-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      var signedRevenue = Math.abs(Number(fd.get('revenue')) || 0) * revenueSign;
      var data = category === 'other'
        ? {
            itemId: '',
            description: (fd.get('description') || '').trim() || 'Other income',
            year: Number(fd.get('year')) || thisYear,
            rentalCount: 0,
            revenue: signedRevenue,
          }
        : {
            itemId: fd.get('itemId'),
            description: '',
            year: Number(fd.get('year')) || thisYear,
            rentalCount: Number(fd.get('rentalCount')) || 0,
            revenue: signedRevenue,
          };
      if (isEdit) {
        Object.assign(entry, data);
      } else {
        state.historicalAdjustments.push(Object.assign({ id: uid() }, data));
      }
      storageSet('historicalAdjustments', state.historicalAdjustments);
      closeModal();
      render();
    });
  }

  document.getElementById('fab').addEventListener('click', function () { openRentalModal(null); });

  function renderLogin(errorMsg) {
    var root = document.getElementById('root');
    root.innerHTML =
      '<div class="bl-login">' +
        '<h1>Rental Log</h1>' +
        '<p>Log in to view your rentals</p>' +
        (errorMsg ? '<div class="bl-login-error">' + esc(errorMsg) + '</div>' : '') +
        '<input id="bl-login-email" type="email" placeholder="Email" autocomplete="username">' +
        '<input id="bl-login-pass" type="password" placeholder="Password" autocomplete="current-password">' +
        '<button type="button" id="bl-login-btn">Log In</button>' +
      '</div>';
    document.getElementById('bl-login-btn').addEventListener('click', doLogin);
    document.getElementById('bl-login-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  }

  async function doLogin() {
    var email = document.getElementById('bl-login-email').value.trim();
    var pass = document.getElementById('bl-login-pass').value;
    if (!email || !pass) return;
    var btn = document.getElementById('bl-login-btn');
    btn.disabled = true; btn.textContent = 'Logging in…';
    var res = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (res.error) { renderLogin(res.error.message); return; }
    sbSession = res.data.session;
    cloudStatus = 'synced';
    load();
  }

  async function boot() {
    if (!sb) { load(); return; }
    var s = await sb.auth.getSession();
    sbSession = s.data.session;
    if (!sbSession) { renderLogin(); return; }
    cloudStatus = 'synced';
    sb.auth.onAuthStateChange(function (event, session) { sbSession = session; });
    load();
  }

  boot();
})();
</script>
</body>
</html>
